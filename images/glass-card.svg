<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>磨砂玻璃卡片示意图</title>
  <defs>
    <radialGradient id="a" cx="25%" cy="30%" r="45%"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient>
    <radialGradient id="b" cx="80%" cy="25%" r="40%"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#fdba74" stop-opacity="0"/></radialGradient>
    <radialGradient id="c" cx="60%" cy="95%" r="50%"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset="1" stop-color="#fff" stop-opacity=".32"/></linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3c326e" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#a)"/>
  <rect width="1200" height="720" fill="url(#b)"/>
  <rect width="1200" height="720" fill="url(#c)"/>
  <circle cx="380" cy="300" r="120" fill="#a78bfa" opacity=".55" filter="url(#blur)"/>
  <circle cx="820" cy="430" r="140" fill="#fb923c" opacity=".45" filter="url(#blur)"/>
  <g filter="url(#sh)">
    <rect x="300" y="170" width="600" height="380" rx="36" fill="url(#glass)" stroke="#fff" stroke-opacity=".8" stroke-width="2"/>
  </g>
  <circle cx="380" cy="252" r="34" fill="#a78bfa" opacity=".85"/>
  <rect x="436" y="230" width="220" height="18" rx="9" fill="#1d1d2b" opacity=".75"/>
  <rect x="436" y="260" width="140" height="12" rx="6" fill="#4a4a5e" opacity=".45"/>
  <rect x="346" y="324" width="508" height="14" rx="7" fill="#4a4a5e" opacity=".35"/>
  <rect x="346" y="356" width="460" height="14" rx="7" fill="#4a4a5e" opacity=".35"/>
  <rect x="346" y="388" width="380" height="14" rx="7" fill="#4a4a5e" opacity=".35"/>
  <rect x="346" y="456" width="132" height="44" rx="22" fill="#6b4fd8"/>
  <rect x="494" y="456" width="112" height="44" rx="22" fill="#fff" fill-opacity=".6" stroke="#fff"/>
  <text x="412" y="484" font-family="sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Glass</text>
  <text x="550" y="484" font-family="sans-serif" font-size="17" fill="#1d1d2b" text-anchor="middle">Card</text>
</svg>
