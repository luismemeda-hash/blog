<!doctype html>
<!--
  磨砂玻璃个人博客 · 页面骨架
  这里只有结构，不需要改动。站点信息在 js/site.js，文章是 posts/ 目录里的 Markdown 文件
  （npm run build 生成 js/posts.js），配色在 css/style.css 顶部的变量里修改。详见 README.md。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>陛下的小站</title>
    <meta name="description" content="陛下的小站 · Luis 的个人博客，记录生活、技术与灵感。" />
    <meta name="author" content="Luis" />
    <link rel="canonical" href="https://blog.luis.rr.kg/" />

    <!-- 分享卡片：微信 / Telegram / X / Facebook 等读取这些标签 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="陛下的小站" />
    <meta property="og:title" content="陛下的小站" />
    <meta property="og:description" content="Luis 的个人博客，记录生活、技术与灵感。" />
    <meta property="og:url" content="https://blog.luis.rr.kg/" />
    <meta property="og:image" content="https://blog.luis.rr.kg/images/icon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="陛下的小站" />
    <meta name="twitter:description" content="Luis 的个人博客，记录生活、技术与灵感。" />
    <meta name="twitter:image" content="https://blog.luis.rr.kg/images/icon.png" />
    <meta itemprop="name" content="陛下的小站" />
    <meta itemprop="description" content="Luis 的个人博客，记录生活、技术与灵感。" />
    <meta itemprop="image" content="https://blog.luis.rr.kg/images/icon.png" />

    <!-- 图标：SVG 内嵌即可生效；PNG 需上传 images/icon.png -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%2367e8f9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='46' font-family='Arial,Helvetica,sans-serif' font-size='40' font-weight='700' text-anchor='middle' fill='%23fff'%3EL%3C/text%3E%3C/svg%3E" />
    <link rel="icon" type="image/png" sizes="512x512" href="images/icon.png" />
    <link rel="apple-touch-icon" href="images/icon.png" />
    <meta name="theme-color" content="#a78bfa" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- 微信内分享会抓取正文里第一张足够大的图作缩略图 -->
    <div style="display:none" aria-hidden="true"><img src="images/icon.png" alt="陛下的小站" width="512" height="512" /></div>
    <div class="x-bg" aria-hidden="true"><span></span><span></span><span></span></div>

    <div class="x-wrap" id="x-wrap">
      <header class="x-nav" id="x-nav">
        <!-- 玻璃背景：展开 / 收起两种状态预先布局，切换时交叉淡化 -->
        <div class="x-nav__bg" aria-hidden="true"><i class="x-nbg x-nbg--wide"></i><i class="x-nbg x-nbg--compact"></i></div>
        <span class="x-ind" aria-hidden="true"></span>
        <a class="x-brand" id="x-brand" href="#top"></a>
        <nav class="x-links-wrap" aria-label="主导航">
          <ul class="x-links">
            <li><a href="#top" data-target="top" aria-current="page">首页</a></li>
            <li><a href="#posts" data-target="posts">文章</a></li>
            <li><a href="#archive" data-target="archive">归档</a></li>
            <li><a href="#about" data-target="about">关于</a></li>
          </ul>
        </nav>
        <button class="x-toggle x-search-btn" id="x-search-btn" type="button" aria-label="搜索文章（快捷键 / 或 Ctrl+K）" aria-haspopup="dialog" aria-expanded="false" aria-controls="x-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button class="x-toggle" id="x-toggle" type="button" aria-label="切换深色模式">
          <svg class="x-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="x-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </header>

      <main>
        <div class="x-spy" id="top" data-spy="0">
          <section class="x-hero x-glass" id="x-hero" aria-label="个人简介"></section>
          <section class="x-section" aria-labelledby="featured-h">
            <h2 class="x-h2" id="featured-h">精选文章</h2>
            <div id="x-featured"></div>
          </section>
        </div>

        <div class="x-layout x-section">
          <div class="x-main-col">
            <section class="x-spy" id="posts" data-spy="1" aria-labelledby="posts-h">
              <h2 class="x-h2" id="posts-h">最新文章</h2>
              <div class="x-grid" id="x-grid"></div>
            </section>

            <section class="x-spy x-section" id="archive" data-spy="2" aria-labelledby="archive-h">
              <h2 class="x-h2" id="archive-h">归档</h2>
              <div class="x-archive x-glass" id="x-archive"></div>
            </section>
          </div>

          <aside class="x-side" id="x-side" aria-label="侧栏">
            <div class="x-widget x-glass">
              <h3>分类</h3>
              <ul class="x-cats" id="x-cats"></ul>
            </div>
            <div class="x-widget x-glass">
              <h3>标签云</h3>
              <ul class="x-tags x-cloud" id="x-cloud"></ul>
            </div>
            <div class="x-widget x-glass x-spy" id="about" data-spy="3">
              <h3>关于我</h3>
              <p id="x-about"></p>
            </div>
            <div class="x-widget x-glass">
              <h3>订阅</h3>
              <p>新文章发布时，第一时间送到你的邮箱。</p>
              <form class="x-sub" id="x-sub" novalidate>
                <label class="x-note" for="x-email">邮箱地址</label>
                <input class="x-input" id="x-email" type="email" placeholder="you@example.com" autocomplete="email" />
                <button class="x-pill x-pill--btn x-pill--primary" type="submit">订阅</button>
                <p class="x-note" id="x-sub-msg" role="status" aria-live="polite"></p>
              </form>
            </div>
          </aside>
        </div>
      </main>

      <footer class="x-foot x-glass" id="x-foot"></footer>
    </div>

    <!-- 页内阅读器：路由 #post/<id>[/<小节>]、#category/<名称>、#tag/<名称> -->
    <div class="x-reader" id="x-reader" role="dialog" aria-modal="true" aria-labelledby="x-r-title" hidden>
      <div class="x-progress" aria-hidden="true"><i id="x-progress"></i></div>
      <div class="x-reader__grid" id="x-r-grid">
        <div class="x-reader__bar"><button class="x-pill x-pill--btn x-back" id="x-back" type="button">← 返回</button></div>
        <article class="x-reader__panel" id="x-r-panel" tabindex="-1"></article>
        <nav class="x-toc x-glass" id="x-toc" aria-label="文章目录" hidden></nav>
      </div>
    </div>

    <!-- 站内搜索：导航里的搜索按钮、/ 或 Ctrl/⌘+K 打开 -->
    <div class="x-search" id="x-search" hidden>
      <div class="x-search__panel" role="dialog" aria-modal="true" aria-label="搜索文章">
        <div class="x-search__field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="x-q" type="search" placeholder="搜索标题、标签、分类或正文…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
            role="combobox" aria-label="搜索文章" aria-expanded="false" aria-controls="x-sr" aria-autocomplete="list" />
          <button class="x-search__close" id="x-search-close" type="button" aria-label="关闭搜索">Esc</button>
        </div>
        <div class="x-search__body">
          <p class="x-search__msg" id="x-sr-msg" role="status" aria-live="polite"></p>
          <ul class="x-search__list" id="x-sr" role="listbox" aria-label="搜索结果"></ul>
        </div>
        <div class="x-search__foot" aria-hidden="true"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span><span><kbd>Esc</kbd> 关闭</span><span><kbd>/</kbd> 或 <kbd>Ctrl</kbd><kbd>K</kbd> 随时打开</span></div>
      </div>
    </div>

    <!-- 回到顶部：主页面与阅读器共用 -->
    <button class="x-totop" id="x-totop" type="button" aria-label="回到顶部">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>

    <noscript><p class="x-noscript">请开启 JavaScript 以浏览文章内容。</p></noscript>

    <script src="js/site.js"></script>
    <script src="js/posts.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
